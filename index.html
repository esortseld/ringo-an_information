<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林檎庵 Information</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #222;
      background: #fffaf5;
      line-height: 1.7;
    }

    header {
      padding: 32px 20px 24px;
      text-align: center;
      background: #8f1d1d;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.6rem);
      letter-spacing: 0;
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    section {
      margin: 0 0 28px;
      padding: 20px;
      border: 1px solid #eadbd0;
      border-radius: 8px;
      background: #fff;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      color: #8f1d1d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 14px 12px;
      border: 1px solid #eadbd0;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      background: #f7eee7;
      color: #4b2b22;
      font-weight: 700;
    }

    td {
      background: #fffdfb;
    }

    @media (max-width: 600px) {
      header {
        padding: 28px 16px 20px;
      }

      main {
        padding: 20px 12px 36px;
      }

      section {
        padding: 16px;
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      tr {
        border: 1px solid #eadbd0;
        border-radius: 8px;
        overflow: hidden;
      }

      td {
        display: grid;
        grid-template-columns: 5.5em 1fr;
        gap: 12px;
        border: 0;
        border-bottom: 1px solid #eadbd0;
      }

      td:last-child {
        border-bottom: 0;
      }

      td::before {
        content: attr(data-label);
        font-weight: 700;
        color: #4b2b22;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>林檎庵 Information</h1>
  </header>

  <main>
    <section aria-labelledby="studio-schedule">
      <h2 id="studio-schedule">スタジオ練習予定</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日にち</th>
            <th scope="col">時間</th>
            <th scope="col">場所</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-label="日にち">未定</td>
            <td data-label="時間">未定</td>
            <td data-label="場所">未定</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section aria-labelledby="live-schedule">
      <h2 id="live-schedule">ライブ予定</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日にち</th>
            <th scope="col">時間</th>
            <th scope="col">場所</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-label="日にち">未定</td>
            <td data-label="時間">未定</td>
            <td data-label="場所">未定</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
