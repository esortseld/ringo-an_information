<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林檎庵 Information</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #222;
      background: #fffaf5;
      line-height: 1.7;
    }

    header {
      padding: 34px 20px 26px;
      text-align: center;
      background: #8f1d1d;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.6rem);
      letter-spacing: 0;
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    section {
      margin: 0 0 28px;
      padding: 20px;
      border: 1px solid #eadbd0;
      border-radius: 8px;
      background: #fff;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      color: #8f1d1d;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #eadbd0;
      border-radius: 8px;
      background: #fffdfb;
    }

    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
    }

    .live-table {
      min-width: 920px;
    }

    th,
    td {
      padding: 14px 12px;
      border-right: 1px solid #eadbd0;
      border-bottom: 1px solid #eadbd0;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    th {
      background: #f7eee7;
      color: #4b2b22;
      font-weight: 700;
    }

    td {
      background: #fffdfb;
    }

    .tbc {
      color: #c1121f;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      header {
        padding: 28px 16px 20px;
      }

      main {
        padding: 20px 12px 36px;
      }

      section {
        padding: 16px;
      }

      .table-wrap {
        border-radius: 8px;
      }

      table {
        min-width: 520px;
      }

      .live-table {
        min-width: 860px;
      }

      th,
      td {
        padding: 12px 10px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>林檎庵 Information</h1>
  </header>

  <main>
    <section aria-labelledby="studio-schedule">
      <h2 id="studio-schedule">スタジオ練習予定</h2>
      <div class="table-wrap" role="region" aria-label="スタジオ練習予定の表" tabindex="0">
        <table>
          <thead>
            <tr>
              <th scope="col">日程</th>
              <th scope="col">時間</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026年6月20日（土）</td>
              <td>15:00〜18:00</td>
            </tr>
            <tr>
              <td>2026年7月11日（土）</td>
              <td>14:00〜17:00</td>
            </tr>
            <tr>
              <td>2026年8月22日（土）</td>
              <td>14:00〜17:00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="live-schedule">
      <h2 id="live-schedule">ライブ予定</h2>
      <div class="table-wrap" role="region" aria-label="ライブ予定の表" tabindex="0">
        <table class="live-table">
          <thead>
            <tr>
              <th scope="col">日程</th>
              <th scope="col">会場</th>
              <th scope="col">場所</th>
              <th scope="col">集合</th>
              <th scope="col">開場</th>
              <th scope="col">開演</th>
              <th scope="col">出演時間</th>
              <th scope="col">持ち時間</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026年7月18日（土）</td>
              <td>Memory Lane</td>
              <td>栄</td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td>18:30</td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
            </tr>
            <tr>
              <td>2026年8月1日（土）</td>
              <td>Strawberry Fields</td>
              <td>江南</td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
            </tr>
            <tr>
              <td>2026年9月5日（土）</td>
              <td>アルマジロ</td>
              <td>本郷</td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
              <td><span class="tbc">TBC</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
